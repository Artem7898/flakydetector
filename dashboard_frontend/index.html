<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- SEO -->
    <title>FlakyDetector · AST & ML Flaky Test Analysis</title>
    <meta name="description" content="Scientific-grade flaky test detection powered by AST analysis and machine learning. Identify unstable tests before they hit production." />
    <meta name="keywords" content="flaky tests, test automation, AST analysis, machine learning, python testing, CI/CD" />
    <meta name="author" content="FlakyDetector" />
    <meta name="robots" content="index, follow" />

    <!-- Theme & Mobile -->
    <meta name="theme-color" content="#0b1120" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FlakyDetector" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FlakyDetector · AST & ML Flaky Test Analysis" />
    <meta property="og:description" content="Scientific-grade flaky test detection powered by AST analysis and machine learning." />
    <meta property="og:site_name" content="FlakyDetector" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FlakyDetector · AST & ML Flaky Test Analysis" />
    <meta name="twitter:description" content="Scientific-grade flaky test detection powered by AST analysis and machine learning." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Preconnect for Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Critical CSS inline для предотвращения FOUC -->
    <style>
      html { background-color: #0b1120; }
      body {
        margin: 0;
        background-color: #0b1120;
        color: #f1f5f9;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #root { min-height: 100vh; }
      /* Loader на время инициализации React */
      .app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1120;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      .app-loader.hidden { opacity: 0; pointer-events: none; }
      .loader-ring {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(56, 189, 248, 0.2);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Fallback loader (скрывается React-ом после mount) -->
      <div class="app-loader" id="initial-loader">
        <div class="loader-ring"></div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
