[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "flakydetector"
version = "0.1.0"
description = "Scientific-grade flaky test detection system using AST analysis and ML classification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Artem Alimpiev", email = "alimpievne@gmail.com" },
]
keywords = ["flaky-tests", "ci-cd", "machine-learning", "ast-analysis", "test-quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    # Analysis
    "astroid>=3.3.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    # ML
    "catboost>=1.2.5",
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    # LLM Integration (optional)
    "openai>=1.50.0",
    "anthropic>=0.35.0",
    # Visualization
    "plotly>=5.24.0",
    "kaleido>=0.2.1",
    # Utils
    "structlog>=24.4.0",
    "rich>=13.9.0",
    "tenacity>=8.5.0",
    "python-dotenv>=1.0.1",
    "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.6.0",
    "pyright>=1.1.380",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "factory-boy>=3.3.0",
    "faker>=28.0.0",
]
ci = [
    "flakydetector[dev]",
    "pytest-timeout>=2.3.0",
]
gpu = [
    "cupy-cuda12x>=13.3.0",
    "jax[cuda12]>=0.4.35",
]

docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
]

[project.scripts]
flakydetector = "flakydetector.cli:main"

[project.urls]
Repository = "https://github.com/Artem7898/flakydetector"
Documentation = "https://readthedocs.io"
Changelog = "https://github.com/Artem7898/flakydetector/releases"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/flakydetector"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["flakydetector"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnusedImport = "error"
reportUnusedClass = "error"
reportUnusedFunction = "error"

[tool.pytest.ini_options]
testpaths = [
    "tests/unit",
    "tests/integration",
]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "-ra",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "unit: marks unit tests",
]

[tool.coverage.run]
source = ["src/flakydetector"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true

# Игнорируем отсутствие типов в библиотеках, у которых нет стабов (например, catboost, tree-sitter)
[[tool.mypy.overrides]]
module = [
    "catboost.*",
    "tree_sitter.*",
    "tree_sitter_python.*",
    "sklearn.*",
    "plotly.*",
    "kaleido.*"
]
ignore_missing_imports = true

# Добавь в конец pyproject.toml

[project.entry-points.pytest11]
flaky-trail = "flakydetector.pytest_flaky_trail.plugin"

