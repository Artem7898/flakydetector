[build-system]
requires = ["hatchling>=1.24,<2"]
build-backend = "hatchling.build"

[project]
name = "flakydetector"
version = "0.2.1rc1"
description = "Explainable static test-risk analysis and comparable pytest execution evidence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "Artem Alimpiev", email = "alimpievne@gmail.com"}]
dependencies = ["pydantic>=2.9,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "httpx>=0.27,<1"]
pytest = ["pytest>=8.3,<10"]
ml = ["catboost>=1.2.5,<2", "numpy>=2,<3", "scikit-learn>=1.5,<2"]
rag = ["chromadb>=1.5.9,<2"]
llm = ["openai>=1.50,<3"]
github = ["httpx>=0.27,<1"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<8", "coverage>=7.10,<8", "pytest-xdist>=3.6,<4", "ruff==0.15.15", "pyright==1.1.410", "build>=1.2,<2", "hatchling>=1.24,<2"]
docs = ["sphinx>=8,<10", "myst-parser>=4,<6", "furo"]

[project.scripts]
flakydetector = "flakydetector.cli:main"

[project.entry-points.pytest11]
flaky-trail = "flakydetector.pytest_flaky_trail.plugin"

[project.urls]
Repository = "https://github.com/Artem7898/flakydetector"

[tool.hatch.build.targets.wheel]
packages = ["src/flakydetector"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs", "/README.md", "/README.RUS.md", "/CHANGELOG.md", "/LICENSE", "/CITATION.cff", "/.readthedocs.yaml", "/pyproject.toml", "/uv.lock", "/Dockerfile", "/compose.yaml", "/.env.example", "/.github", "/.dockerignore", "/.pre-commit-config.yaml", "/dashboard_frontend/src", "/dashboard_frontend/package.json", "/dashboard_frontend/package-lock.json", "/dashboard_frontend/vite.config.js", "/dashboard_frontend/index.html"]
exclude = ["**/__pycache__/**", "**/_build/**", "**/.env", "**/*.db", "**/*.cbm", "**/node_modules/**"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra --strict-markers --tb=short"
asyncio_mode = "auto"
markers = ["integration: cross-component contract test"]

[tool.coverage.run]
source = ["flakydetector"]
branch = true

patch = ["subprocess"]

[tool.coverage.report]
fail_under = 80
