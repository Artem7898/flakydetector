name: FlakyDetector CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_release.py --output artifacts/flakydetector-source.zip
      - run: python scripts/check_release.py artifacts/flakydetector-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-source
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  verify-final-zip:
    name: Verify artifact (Python ${{ matrix.python }})
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidate-source
          path: artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.18'
          python-version: ${{ matrix.python }}
      - name: Extract candidate verifier
        run: python -m zipfile -e artifacts/flakydetector-source.zip candidate
      - name: Verify final ZIP, installed wheel and real container
        run: >-
          python candidate/flakydetector-*/scripts/verify_release.py
          artifacts/flakydetector-source.zip --output verification
          --python ${{ matrix.python }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.python }}
          path: verification/
          if-no-files-found: warn
          retention-days: 14

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [package, verify-final-zip]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every artifact job to succeed
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          VERIFY_RESULT: ${{ needs.verify-final-zip.result }}
        run: |
          set -euo pipefail
          printf 'package=%s verification=%s\n' "$PACKAGE_RESULT" "$VERIFY_RESULT"
          test "$PACKAGE_RESULT" = success
          test "$VERIFY_RESULT" = success
