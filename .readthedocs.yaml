version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Exported from uv.lock: no application, ML model, API server or Node build
# is required to render the hand-written documentation.
python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: true
