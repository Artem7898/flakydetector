version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  apt_packages:
    - build-essential
    - gfortran
  jobs:
    post_install:
      - pip install uv
      - uv pip install --python "$READTHEDOCS_VIRTUALENV_PATH/bin/python" ".[docs,dev]"

python:
  install: []

sphinx:
  configuration: docs/conf.py
